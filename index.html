<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zuoei.com</title>
  <meta name="description" content="Glume.cn 域名停放页面" />
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1d2433;
      --muted: #6b7280;
      --accent: #5b6cff;
      --accent-soft: #eef0ff;
      --border: #e8eaf1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      pointer-events: none;
    }

    body::before {
      width: 420px; height: 420px;
      top: -160px; left: -120px;
      background: #dfe4ff;
    }

    body::after {
      width: 360px; height: 360px;
      bottom: -140px; right: -100px;
      background: #e5f0ff;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 56px 40px 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(30, 41, 59, 0.08);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 6px 12px;
      border-radius: 999px;
    }

    .badge .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .logo {
      margin-top: 28px;
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .logo span { color: var(--accent); }

    .title {
      margin-top: 12px;
      font-size: 27px;
      font-weight: 500;
      color: var(--text);
    }

    .desc {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.8;
      color: var(--muted);
    }

    .divider {
      margin: 32px 0 24px;
      height: 1px;
      background: var(--border);
    }

    .contact {
      font-size: 13px;
      color: var(--muted);
    }

    .contact a {
      color: var(--accent);
      text-decoration: none;
    }

    .contact a:hover { text-decoration: underline; }

    .footer {
      margin-top: 36px;
      font-size: 12px;
      color: #9aa1ae;
    }

    .beian {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 16px;
      margin-top: 10px;
      font-size: 12px;
      color: #9aa1ae;
    }

    .beian a {
      color: #9aa1ae;
      text-decoration: none;
    }

    .beian a:hover { color: var(--accent); }

    @media (max-width: 480px) {
      .card { padding: 40px 24px 32px; }
      .logo { font-size: 32px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge"><span class="dot"></span>DOMAIN PARKED</div>
    <h1 class="logo">Zuoei<span>.com</span></h1>
    <p class="title">这个域名正在停放中</p>
    <p class="desc">网站尚未上线，我们正在为它准备更好的内容。<br />感谢你的耐心等待。</p>
    <div class="divider"></div>
    <p class="contact">如有合作或咨询，请联系 <a href="mailto:hello@labia.cn">Hello@zuoei.com</a></p>
    <p class="footer">&copy; 2026 Zuoei.com. All rights reserved.</p>
    <div class="beian">
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">京ICP备04000001号-7</a>
      <a href="https://www.beian.gov.cn/portal/registerSystemInfo?recordcode=11040102700068" target="_blank" rel="noopener noreferrer">京公网安备 11040102700068号</a>
    </div>
  </main>
</body>
</html>
